name: APK build
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: "17"}}, {uses: actions/setup-python@v5, with: {python-version: "3.11"}}, {uses: gradle/actions/setup-gradle@v4}, {run: "chmod +x gradlew && ./gradlew assembleRelease --stacktrace --no-daemon"}, {run: "mkdir -p out && find app/build/outputs/apk -name '*.apk' -exec cp {} out/ ';' && ls -la out/"}, {uses: actions/upload-artifact@v4, with: {name: apk, path: "out/*.apk", retention-days: 90}}]}}
