name: APK 빌드

# 파일을 올리거나 고칠 때마다 자동으로 돌고,
# Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있습니다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 파이썬 준비 (Chaquopy 가 패키지를 받을 때 씁니다)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: APK 이름 정리
        if: success()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: APK 올리기
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 합류신호알림-APK
          path: out/*.apk
          retention-days: 90

      - name: 실패했을 때 로그 남기기
        if: failure()
        run: |
          echo "=== 빌드 실패 ==="
          find . -name "*.log" -path "*build*" | head -20
